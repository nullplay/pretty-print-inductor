[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-print-inductor"
version = "0.1.0"
description = "Logical loop IR pretty-printer for PyTorch Inductor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools.packages.find]
include = ["pretty_print_loop*"]
exclude = ["tests*"]
